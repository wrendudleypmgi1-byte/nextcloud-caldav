version: 2.1

jobs:
  uxSumBox:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce stage5 fixture
          command: |
            mkdir -p /tmp/build-04
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) print i*0+1,i}' > /tmp/build-04/dev_82680; true
            echo "produced $(wc -l </tmp/build-04/dev_82680) lines"
      - persist_to_workspace:
          root: /tmp/build-04
          paths:
            - 'dev_82680'
  fix-queue-bug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build-04
      - run:
          name: Pick up output
          command: |
            { head /tmp/build-04/dev_82680 2>/dev/null || echo "head-fail"; } | head -1 | wc -c || true
      - run:
          name: Fetch main branch
          command: git clone --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack cached data
          command: tar xf content.tar
      - run:
          name: Index artifacts
          command: sleep 60
      - run:
          name: Post-build check
          command: sleep 15
      - run:
          no_output_timeout: 96m
          command: taskset -c 0-3 ./run-task
